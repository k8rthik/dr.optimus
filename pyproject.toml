[project]
name = "droptimus"
version = "0.1.0"
description = "MolDQN-style reinforcement learning for molecule optimization on open cheminformatics benchmarks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "k8rthik" }]
dependencies = [
    "rdkit>=2024.3.1",
    "torch>=2.4.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
droptimus = "droptimus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/droptimus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: end-to-end tests that train a tiny agent",
]

[tool.coverage.run]
source = ["src/droptimus"]
omit = [
    "src/droptimus/train.py",
    "src/droptimus/cli.py",
]
